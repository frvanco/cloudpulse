steps:
  - id: test
    name: node:24
    dir: apps/api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run lint
        npm test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    args:
      - build
      - -t
      - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA
      - .

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    args:
      - build
      - --target
      - migrate
      - -t
      - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-migrate:$SHORT_SHA
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA

  - id: push-migrate
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-migrate:$SHORT_SHA

  - id: update-migrate-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - cloudpulse-migrate
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --image=europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-migrate:$SHORT_SHA
      - --quiet

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - cloudpulse-migrate
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --wait
      - --quiet

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - cloudpulse-api
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --image=europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA
      - --no-traffic
      - --quiet

  - id: tag-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - cloudpulse-api
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --update-tags=candidate=LATEST
      - --quiet

  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        gcloud run services describe cloudpulse-api \
          --project=$PROJECT_ID \
          --region=europe-west9 \
          --format=json > /workspace/service.json

        SERVICE_URL="$$(python3 -c '
        import json
        with open("/workspace/service.json") as f:
            service = json.load(f)
        print(service["status"]["url"])
        ')"

        CANDIDATE_URL="$$(python3 -c '
        import json
        with open("/workspace/service.json") as f:
            service = json.load(f)
        candidates = [
            t for t in service["status"]["traffic"]
            if t.get("tag") == "candidate"
        ]
        if len(candidates) != 1:
            raise SystemExit("Le tag candidate est absent ou ambigu")
        print(candidates[0]["url"])
        ')"

        TOKEN="$$(gcloud auth print-identity-token \
          --audiences="$${SERVICE_URL}")"

        test -n "$${TOKEN}"

        printf 'Test readiness : %s/health/ready\n' "$${CANDIDATE_URL}"

        curl --fail --silent --show-error \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 5 \
          --retry-delay 3 \
          --retry-max-time 120 \
          --retry-connrefused \
          -H "Authorization: Bearer $${TOKEN}" \
          "$${CANDIDATE_URL}/health/ready"

        printf '\nSmoke test réussi\n'

  - id: promote-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - cloudpulse-api
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --to-tags=candidate=100
      - --quiet
  - id: deploy-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - cloudpulse-ingest
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --image=europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA
      - --no-traffic
      - --quiet

  - id: tag-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - cloudpulse-ingest
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --update-tags=candidate=LATEST
      - --quiet

  - id: smoke-test-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        gcloud run services describe cloudpulse-ingest \
          --project=$PROJECT_ID \
          --region=europe-west9 \
          --format=json > /workspace/ingest-service.json

        SERVICE_URL="$$(python3 -c '
        import json
        with open("/workspace/ingest-service.json") as f:
            service = json.load(f)
        print(service["status"]["url"])
        ')"

        CANDIDATE_URL="$$(python3 -c '
        import json
        with open("/workspace/ingest-service.json") as f:
            service = json.load(f)
        candidates = [
            t for t in service["status"]["traffic"]
            if t.get("tag") == "candidate"
        ]
        if len(candidates) != 1:
            raise SystemExit("Le tag candidate est absent ou ambigu")
        print(candidates[0]["url"])
        ')"

        TOKEN="$$(gcloud auth print-identity-token \
          --audiences="$${SERVICE_URL}")"

        test -n "$${TOKEN}"

        printf 'Test ingestion : %s/health/ready\n' "$${CANDIDATE_URL}"

        curl --fail --silent --show-error \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 5 \
          --retry-delay 3 \
          --retry-max-time 120 \
          --retry-connrefused \
          -H "Authorization: Bearer $${TOKEN}" \
          "$${CANDIDATE_URL}/health/ready"

        printf '\nSmoke test ingestion réussi\n'

  - id: promote-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - cloudpulse-ingest
      - --project=$PROJECT_ID
      - --region=europe-west9
      - --to-tags=candidate=100
      - --quiet

images:
  - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA
  - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-migrate:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s