steps:
  - id: test
    name: node:24
    dir: apps/api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run lint
        npm test

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    args:
      - build
      - -t
      - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA
      - .

images:
  - europe-west9-docker.pkg.dev/$PROJECT_ID/cloudpulse/cloudpulse-api:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
