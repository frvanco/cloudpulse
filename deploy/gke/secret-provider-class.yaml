apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudpulse-api-secrets
  namespace: cloudpulse
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/cloudpulse-001/secrets/database-url/versions/1"
        path: "database-url"
      - resourceName: "projects/cloudpulse-001/secrets/twelve-data-api-key/versions/1"
        path: "twelve-data-api-key"
