apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: cloudpulse-api
description: Déploiement progressif de l’API CloudPulse
serialPipeline:
  stages:
    - targetId: prod
      profiles: [prod]
      strategy:
        canary:
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
          canaryDeployment:
            percentages: [10, 50]
            verify: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
description: Cloud Run CloudPulse en production
requireApproval: true
run:
  location: projects/cloudpulse-001/locations/europe-west9
executionConfigs:
  - usages: [RENDER, DEPLOY, VERIFY]
    serviceAccount: cloudpulse-deploy@cloudpulse-001.iam.gserviceaccount.com
    executionTimeout: 1200s
